services:
  execution:
    build:
      context: .
      dockerfile: ${CLIENT}/Dockerfile
    ports:
      - "18545:8545"       # RPC
      - "18546:8546"       # websocket
      - "17301:6060"       # metrics
      - "31303:30303"     # P2P TCP
      - "31303:30303/udp" # P2P UDP
    command: [ "bash", "./execution-entrypoint" ]
    volumes:
        - ${HOST_DATA_DIR}:/data
        - /root/nodes-ipc:/ipc
    env_file:
      # select your network here:
#      - .env.sepolia
      - .env.mainnet
    networks:
      - base-reth-network
    ipc: host
  node:
    build:
      context: .
      dockerfile: ${CLIENT}/Dockerfile
    depends_on:
      - execution
    ports:
      - "17545:8545"     # RPC
      - "19222:9222"     # P2P TCP
      - "19222:9222/udp" # P2P UDP
      - "17300:7300"     # metrics
      - "16060:6060"     # pprof
    command: [ "bash", "./op-node-entrypoint" ]
    env_file:
      # select your network here:
#      - .env.sepolia
      - .env.mainnet
    networks:
      - base-reth-network

networks:
  base-reth-network:
    driver: bridge
